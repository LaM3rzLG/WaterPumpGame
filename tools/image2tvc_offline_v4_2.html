A Videoton TV Computer (TVC) Képkészítő egy professzionális eszköz, amelyet modern digitális képek klasszikus 8 bites magyar Videoton TV Computer (TVC) natív grafikus formátumába való átalakítására terveztek. Az eszköz pontosan szimulálja a TVC hardveres korlátait, beleértve az egyedi 16 színű palettát (megjegyzés: mivel 2 fekete van, ez gyakorlatilag 15 színt jelent) és az anamorfikus pixeleket.

## 1. Első Lépések
A kezdéshez töltsön be egy képet:
- Kattintson a középső **"Válassz képet vagy húzd ide"** területre.
- Alternatív megoldásként húzzon be egy képfájlt közvetlenül a böngészőablakba.
A betöltés után valós időben láthatja a kép előnézetét a TVC korlátozott felbontásában és színpalettájával.

### 1.1. Keret automatikus levágása (Auto-Crop Border)
- A betöltési felületen kiválasztható a **"Keret automatikus levágása (bal felső pixel alapján)"** opció.
- Ha be van kapcsolva, a kép betöltésekor a rendszer megvizsgálja a bal felső sarokpixel (x=0, y=0) színét, és automatikusan eltávolítja a kép 4 oldaláról a körülötte lévő egyszínű keretet/margót.
- A már betöltött képeknél a Kompozíció panel fejlécében található **"Keret levágása"** gombra kattintva bármikor utólag is 1 kattintással levágható a kép körüli egyszínű keret.

## 2. A Felület Áttekintése

### 2.1. Színmódok
Az alkalmazás három különböző TVC grafikus módot támogat. Ezek között a megfelelő gombokkal válthat. Az alkalmazás minden módhoz megjegyzi a beállításokat, így a visszaváltáskor a korábbi paraméterek visszaállnak.

*   **16 Szín:** Az eredeti 128x240-es felbontású mód. A pixelek vízszintesen nyújtottak (2:1 képarány). Mind a 16 TVC szín (15 egyedi szín) elérhető.
*   **4 Szín:** 256x240-es felbontású mód. A pixelek 1:1 képarányúak (négyzetesek). A palettából egyszerre csak 4 szín jeleníthető meg. Az alkalmazás automatikusan kiválasztja a képhez legjobban illő 4 színt, de a "Kiválasztott színek" panelen manuálisan is felülbírálhatja azokat.
*   **2 Szín:** 512x240-es felbontású mód. A pixelek 1:1 képarányúak (négyzetesek). Egyszerre csak 2 szín jeleníthető meg. Az alkalmazás automatikusan kiválasztja a legjobb 2 színt, amit szintén manuálisan is felülbírálhat. Ebben a módban elérhető egy "Színek felcserélése" gomb is, amellyel a kimeneti képen megcserélheti a két kiválasztott színt (pl. piros alapon fehér képből fehér alapon piros kép lesz), anélkül, hogy a palettát módosítaná.

### 2.2. Képméret Módok
*   **Eredeti méret:** A kép az eredeti felbontásában marad, de az aktuálisan kiválasztott színmód palettáját és dithering beállításait alkalmazza. Ebben a módban két mentési lehetőség közül választhat:
    *   **Eredeti méret:** A teljes forráskép mentése az eredeti felbontásában, de TVC színekkel és ditheringgel.
    *   **Kompozíció:** Csak a képernyőn látható kivágás (zoom és pan beállítások szerint) mentése a választott TVC mód fix felbontásában (pl. 128x240).
*   **Teljes TVC képernyő:** A kép a TVC teljes látható képernyőfelbontására lesz méretezve. A pontos felbontás a grafikus módtól függ (512x240, 256x240 vagy 128x240), de a fizikai képarány mindig nagyjából 4:3. A pixelek képaránya a választott módtól függően változik (16 színű módban vízszintesen nyújtottak, 2 színű módban zsugorítottak, 4 színűben pedig négyzetesek), így a végső kép mindig ugyanazt a 4:3-as fizikai képernyőterületet tölti ki.
*   **TVC256k++:** Speciális 16 színű üzemmód 256x240 pixeles felbontással és 1:1 pixel képaránnyal (négyzetes pixelek).

### 2.3. Kompozíció és Pozicionálás
A TVC képernyő fizikai képaránya 4:3, a pixelek alakja és a felbontás a választott színmódtól függ. A kompozíciós beállítások határozzák meg, hogyan illeszkedjen a forráskép ebbe a TVC képernyőbe.

*   **Megjelenítési Módok:**
    *   **Kitöltés vágással:** Kitölti a teljes területet, levágva a felesleges részeket.
    *   **Teljes kép:** Megjeleníti a teljes képet, a széleket a háttérszínnel kitöltve.
    *   **Nyújtás:** A képet pontosan a TVC felbontására kényszeríti (torzulást okozhat).
*   **Nagyítás:** 10% és 1000% között állítható. Használja a csúszkát vagy az egér görgőjét.
*   **Pozicionálás:** Húzza a képet az egérrel, vagy használja a vízszintes/függőleges pozíció csúszkákat. A "Középre" gombbal visszaállíthatja a képet.

### 2.4. Képbeállítások
Finomhangolja a forrásképet a jobb konverzió érdekében.
*   **Fényerő:** A teljes világosság beállítása.
*   **Kontraszt:** A világos és sötét területek közötti különbség növelése.
*   **Telítettség:** A TVC színei élénkek; előfordulhat, hogy csökkenteni kell a forrás telítettségét.
*   **Gamma:** A középtónusok fényerejének szabályozása.
*   **Automata Módok (A1 / A2 / A3):**
    *   **A1 (TVC Stílus):** Automatikusan megtalálja a legstílusosabb beállításokat és dither eljárásokat az autentikus retro TVC képi világ előnyben részesítésével.
    *   **A2 (Hűség Mód):** Kifejezetten a beállított kompozícióra és kivágásra koncentrálva megtalálja azokat a paramétereket, amelyeknél a konvertált kép matematika szerint és vizuálisan a legkisebb eltérést mutatja az eredeti kép ugyanazon részletéhez képest.
    *   **A3 (Tiszta Pixel Art):** Kézzel pixelezett grafikákhoz illő, sík színfelületekre optimalizált mód. Szándékosan kizárja a hibaterjesztéses (zajos) dither módokat, és nem alkalmazza az A1/A2-ben használt "sötét kép felderítése" heurisztikát sem, mert egy szándékosan sötét/hangulatos kép (pl. éjszakai jelenet) sötét is maradjon. Mértékadó teszteknél ez a mód adta a legjobb egyezést kézzel pixelezett referenciaképekkel.
*   **Visszaállít:** Alaphelyzetbe állítja a csúszkákat.
*   **Beállítások másolása (4c / 2c stb. gombok):** A "Képbeállítások" felirat mellett található gombokkal egy kattintással átmásolhatja a többi színmódban (pl. 4 színű vagy 2 színű mód) megadott csúszka-beállításokat a jelenlegi módba.

### 2.5. Dither mód (Színkeverés)
Mivel a TVC csak 15 színt támogat, a program dithering (szórás) segítségével szimulálja a színátmeneteket.
*   **Módszerek:**
    *   **Modernist:** Egyensúly a részletek és a tiszta színek között.
    *   **Ordered (Classic):** Szabályos mintázatú dithering, a 80-as évek stílusában.
    *   **Diffusion (Sierra/Stucki/Jarvis):** Természetes, hibaterjesztésen alapuló módszerek.
    *   **Pattern TVC:** A TVC hardverre optimalizált mintázat. Úgy működik, hogy egy sakktábla mintát hoz létre a paletta két gondosan kiválasztott színének váltakozásával. Ez kihasználja a TVC videokimeneti jellemzőit, vizuálisan összekeverve a két színt a CRT képernyőkön, hogy egy harmadik, köztes szín illúzióját keltse a hibaterjesztés zaja nélkül.
    *   **Threshold (No pattern):** Nincs dithering, csak a legközelebbi szín.
    *   **Yliluoma:** Joel Yliluoma klasszikus, kifejezetten kicsi/szabálytalan palettákra (mint amilyen a TVC 15 színe) kitalált algoritmusa. A Pattern TVC ötletét általánosítja: nem csak 2, hanem akár 8 palettaszínt is kombinálhat egy adott ponton, gamma-korrekt (lineáris fényben történő) keveréssel, finomabb átmeneteket adva. *Megjegyzés:* mivel a TVC palettájában kevés az egymáshoz közeli árnyalat, ez a mód sík, sötét területeken (pl. éjszakai égbolt) inkább színes "konfetti-zajt" adhat a Pattern TVC-hez képest - főleg fotó jellegű, folytonos átmenetű képeknél éri meg kipróbálni.

*   **Pár-letiltás (csak Pattern TVC / Yliluoma módoknál):** A "Dither Finomhangolás" alatt megjelenő rácsban egyenként letiltható, mely két szín keveredhet egymással a mintázatos dithering során. A rács főátlós celláira kattintva egy adott szín *teljesen* kizárható (minden párból egyszerre), ismételt kattintásra pedig visszakapcsolható.

*   **Dither Finomhangolás:**
    *   **Dithering mértéke:** Mennyire legyen "szemcsés" a kép.
    *   **Zajszint:** Véletlenszerű mintákat ad hozzá a sávosodás elkerülése érdekében.
    *   **Tiszta felületek védelme:** Megakadályozza a ditheringet az egyszínű területeken.

### 2.6. Háttérszín
Válasszon egyet a 15 fix TVC szín közül az üres területek kitöltéséhez.

### 2.7. Exportálási Lehetőségek
1. **Mentés BMP-ként:** Szabványos Windows BMP fájl a TVC palettájával.
   *   *Megjegyzés a 16 Szín módhoz:* A BMP-t mentheti **1:1** pixelaránnyal (128x240, nyers tárolási formátum) vagy **2:1** pixelaránnyal (256x240, nyújtva a TVC tényleges megjelenítésének szimulálására).
   *   *TVC256k++ mód:* A BMP mentése 16 színű indexelt (4 bpp) formátumban történik (256x240, pontosan 30 838 bájt fájlmérettel).
2. **Mentés TVC bin-ként:** Nyers bináris adat valódi TVC-hez vagy emulátorhoz.
   *   *TVC256k++ mód:* 256x240 felbontású 16 színű kép, bájtonként 2 ponttal (1. pont a felső 4 bit, 2. pont az alsó 4 bit IRGB kódja, összesen 30 720 bájt).
3. **Mentés ZX7 bin-ként:** ZX7 algoritmussal tömörített bináris adat (\`.bin.zx7\` kiterjesztéssel), amely kevesebb helyet foglal és gyorsabban betölthető a TVC-n.

*A fájlnevek automatikusan tartalmazzák a színmód/felbontásmód utótagját (pl. \`_16c\`, \`_4c\`, \`_2c\`, \`_256k\`). 16 színű módban a BMP fájlnév tartalmazza a képarányt is (pl. \`_1_1\` vagy \`_2_1\`). Minden gombhoz tartozik egy rövid leírás (tooltip), amely megjelenik, ha fölé viszi az egeret.*

### 2.8. Haladó Képfeldolgozás
A v3.8 és v3.9-es verzióban bevezetett eszközök segítenek a forráskép előkészítésében a lehető legjobb konverzió érdekében.

*   **Elő-zajszűrés:** Csökkenti a forráskép digitális zaját a feldolgozás előtt. Ez különösen hasznos fotóknál, mivel megakadályozza, hogy a dithering algoritmus a "zajt" pontozza ki, így tisztább, összefüggőbb felületeket eredményez a TVC-n.
*   **Élkiemelés:** Egy finom élesítő eszköz, amely kiemeli a fontos éleket (például egy arc körvonalait). Ez segít abban, hogy a részletek "túléljék" a kicsinyítési folyamatot, és a végső kép ne legyen túl elmosódott.
*   **Dinamikatartomány-tömörítés (Tone Mapping):** Tömöríti a nagy kontrasztú képek dinamikatartományát. Ha a fotón egyszerre vannak nagyon sötét és nagyon világos részek, a tone mapping segít mindkettőben láthatóvá tenni a részleteket a TVC korlátozott palettáján belül.
*   **Serpentin szkennelés:** Soronként megváltoztatja a dithering folyamat irányát. Ez megtöri a függőleges "csíkozódást", és természetesebb megjelenésű dithering mintákat hoz létre.
*   **Percepciós színtávolság:** Ha be van kapcsolva, a program az emberi szem tényleges színérzékelése alapján számítja ki a színek hasonlóságát (nagyobb súlyt adva a zöldnek és kevesebbet a kéknek). Ez sokkal természetesebbnek tűnő színhelyettesítéseket eredményez.
*   **Pötty-szűrés:** Automatikusan eltávolítja az izolált "kóbor" pixeleket, amelyek néha megjelenhetnek a dithering során. Ez sokkal tisztább, "kézzel rajzolt" hatást eredményez, különösen grafikák és illusztrációk esetén.
*   **Automata színválasztás (K-Means):** 4 és 2 színű módoknál egy kifinomult matematikai algoritmust (K-Means clustering) használ, hogy megtalálja a matematikailag optimális színkészletet az adott képhez, ahelyett, hogy csak a leggyakoribbakat választaná ki.
*   **Átlátszó háttér maszkolása (TVC256k++ / Sprites):** A Kompozíció panelen található gombbal automatikusan feltérképezhető a hasznos rajzot körülvevő külső egyszínű háttér. A program a külső képpontokat a **9. fekete (\`1000\` / \`0x8\` átlátszó)** kódra állítja át, miközben a figura belsejében lévő normál fekete részeket megvédi. A képernyőn a maszk egy egyedi neon-magenta mintával jelenik meg, amely tetszés szerint ki/be kapcsolható, mentéskor pedig a BMP és BIN fájlokba az átlátszó kód kerül.

### 2.9. Beállítások Mentése és Betöltése
A bal oldali panelen mentheti el aktuális beállításait 3 slotba. A mentett beállításokat bármikor betöltheti a megfelelő számú gombbal. A mentett slotokat a gomb sarkában megjelenő kis 'x' gombbal törölheti.

## 3. Pixel Szerkesztő
A konvertált kép pixelenkénti kézi finomítására szolgáló önálló szerkesztő. **Jelenleg csak a 16 színű módokat támogatja** (sima 16 színű 128x240, 2:1 pixelarányú mód, és a négyzetes pixelű TVC256k++ 256x240-es mód) - a 4 és 2 színű szerkesztő egy későbbi frissítésben érkezik.

**Megnyitás:**
*   Egy kész konvertálás eredménye mellett a **"Pixel Szerkesztő"** gombbal nyithatja meg az aktuális képet szerkesztésre.
*   A kezdőképernyőn (még kép betöltése előtt) két linkkel közvetlenül is nyithat egy üres (fekete) vásznat, akár 16 színű, akár 256k módban.
*   A szerkesztőn belüli **"Megnyitás"** gombbal egy korábban mentett, pontosan a cél felbontású PNG-t tölthet be közvetlenül, **konvertálás nélkül** - a program a képpontok színét egy az egyben a TVC paletta legközelebbi színére képezi le. Ha a fájl mérete nem egyezik pontosan a cél felbontással, hibaüzenetet kap.
*   A szerkesztőből a **"Vissza a konverterhez"** gombbal léphet vissza a konverterhez - a szerkesztőben végzett módosítások nem kerülnek vissza a konverterbe, azok csak a szerkesztőből exportálhatók.

**Nézet és navigáció:**
*   **Nagyítás:** az egérgörgővel, a kurzor pozíciója körül központosítva.
*   **Mozgatás (pan):** a középső egérgomb lenyomva tartásával és húzással, vagy a natív görgetősávokkal.
*   Egy bizonyos nagyítási szint felett a program vékony pixelrácsot jelenít meg, hogy könnyebben megkülönböztethetők legyenek az egyes képpontok. A rács a jobb felső eszköztár ikonjával ki/be kapcsolható.
*   Az oldalpanelen egy kis élő előnézet mutatja a teljes képet a végső, helyes képarányban.

**Rajzeszközök:**
*   **Ceruza, Vonal, Téglalap (körvonal), Kitöltött téglalap, Ellipszis, Kitöltés (vödör).**
*   A **vastagság** csúszkával állítható a ceruza és a vonalas eszközök vastagsága.
*   A kitöltés (vödör) eszköz az egyforma színű, összefüggő területet tölti ki az új színnel - előtte ezt az eszközt ki kell választani az eszköztárból.

**Színek:**
*   **Bal egérgomb** az elsődleges, **jobb egérgomb** a másodlagos színnel rajzol.
*   A paletta 15 valódi TVC színt tartalmaz, plusz egy 16. **"átlátszó"** mezőt (ez a hardver 9. feketéje, amit a TVC a maszkolt/átlátszó képpontokhoz használ). A szerkesztőben ez a mező jól megkülönböztethető, feltűnő magenta-fekete "sakktábla" mintával jelenik meg (nem a tényleges közel-fekete RGB-jével), hogy soha ne lehessen összetéveszteni egy valódi színnel. Mentéskor a program automatikusan a helyes átlátszósági kódra (és maszkra) váltja.
*   Egy palettaszínre bal kattintással az elsődleges, jobb kattintással a másodlagos színt állíthatja be.

**Mentés:** ugyanazok a formátumok érhetők el, mint a konverterben: **BMP (1:1)**, 16 színű módban emellett **BMP (2:1)** is, **BIN**, és **BIN (ZX7 tömörített)**. A fájlnevek automatikusan \`_edit\` jelölést és a mód utótagját kapják.

## 4. Tippek
*   A TVC pixelei szélesek; az álló képek gyakran jobban mutatnak elforgatva.
*   Használja az "Automata" gombot, ha nem tudja, hol kezdje.
*   Használja a "Valós méretű előnézet" (szem ikon) funkciót a végső TVC megjelenés megtekintéséhez.
*   Kísérletezzen a "Tiszta felületek védelme" beállítással dithering használatakor, hogy a sima hátterek tiszták maradjanak, miközben az átmenetek finomodnak.

`,Mw=`# Videoton TV Computert (TVC) Image Maker - Comprehensive User Manual (v4.2)

## Introduction
The Videoton TV Computert (TVC) Image Maker is a professional-grade tool designed to convert modern digital images into the native graphics format of the classic 8-bit Hungarian Videoton TV Computer (TVC). The tool accurately simulates the hardware limitations of the TVC, including its unique 16-color palette (note: since there are two blacks, it is effectively 15 colors) and anamorphic pixels.

## 1. Getting Started
To begin, load an image:
- Click the central **"Select Image or Drag & Drop"** area.
- Alternatively, drag and drop an image file directly into the browser window.
Once loaded, you will see a real-time preview of the image in the TVC's restricted resolution and color palette.

### 1.1. Auto-Crop Solid Border
- On the upload screen, you can enable **"Auto-crop solid border (based on top-left pixel)"**.
- When enabled, loading an image automatically inspects the top-left pixel (0,0) color and crops away any surrounding solid color border or margin from all 4 sides.
- For already loaded images, you can click the **"Trim border"** button in the Composition panel header to remove the surrounding solid border at any time with a single click.

## 2. Interface Overview

### 2.1. Color Modes
The application supports three distinct TVC graphics modes. You can switch between them using the buttons provided. The application remembers your settings for each mode, so switching back will restore your previous parameters.

*   **16 Colors:** The original 128x240 resolution mode. Pixels are stretched horizontally (2:1 aspect ratio). All 16 TVC colors (15 unique colors) are available.
*   **4 Colors:** 256x240 resolution mode. Pixels have a 1:1 aspect ratio (square). Only 4 colors from the palette can be displayed at once. The application automatically selects the best 4 colors for your image, but you can manually override them in the "Selected Colors" panel.
*   **2 Colors:** 512x240 resolution mode. Pixels have a 1:1 aspect ratio (square). Only 2 colors can be displayed at once. The application automatically selects the best 2 colors, which you can also manually override. In this mode, an "Invert Colors" button is available, which allows you to swap the two selected colors in the output image (e.g., a white image on a red background becomes a red image on a white background) without modifying the palette itself.

### 2.2. Image Size Modes
*   **Original Size:** The image remains at its original resolution, but applies the palette and dithering of the currently selected color mode. In this mode, you can choose between two saving options:
    *   **Original Size:** Saves the entire source image in its original resolution, but with TVC colors and dithering.
    *   **Composition:** Saves only the visible crop (according to zoom and pan settings) in the fixed resolution of the chosen TVC mode (e.g., 128x240).
*   **Full TVC Screen:** The image is scaled to fit the TVC's full visible screen resolution. The exact resolution depends on the graphics mode (512x240, 256x240, or 128x240), but the physical display aspect ratio is always roughly 4:3. Because the pixel aspect ratio changes depending on the mode (stretched horizontally in 16-color mode, squeezed in 2-color mode, and square in 4-color mode), the final image always fills the same 4:3 physical screen area.
*   **TVC256k++:** Special 16-color mode with 256x240 pixel resolution and 1:1 pixel aspect ratio (square pixels).

### 2.3. Composition & Positioning
The TVC screen has a physical aspect ratio of 4:3, with pixel shape and resolution depending on the selected color mode. The composition settings determine how your source image fits into this TVC screen.

*   **Display Modes:**
    *   **Crop Fill:** Fills the entire area, cropping excess parts.
    *   **Letterbox:** Shows the entire image, filling edges with the background color.
    *   **Stretch Fill:** Forces the image to the exact TVC resolution (may cause distortion).
*   **Zoom:** Adjustable between 10% and 1000%. Use the slider or mouse wheel.
*   **Positioning:** Drag the image with your mouse or use the Horizontal Pos / Vertical Pos sliders. Use the "Center" button to reset the image position.

### 2.4. Adjustments
Fine-tune your source image for better conversion.
*   **Brightness:** Adjusts overall lightness.
*   **Contrast:** Enhances the difference between light and dark areas.
*   **Saturation:** TVC colors are vibrant; you may need to reduce source saturation.
*   **Gamma:** Controls the brightness of midtones.
*   **Auto-Tune (A1 / A2 / A3):**
    *   **A1 (TVC Style):** Automatically finds the most stylistically fitting settings and dither method, favoring an authentic retro TVC look.
    *   **A2 (Fidelity Mode):** Focuses specifically on your current composition/crop and finds the parameters that mathematically and visually deviate the least from that exact part of the source image.
    *   **A3 (Clean Pixel Art):** Tuned for hand-pixelated artwork with flat color areas. Deliberately excludes noisy error-diffusion dither methods, and skips the "brighten dark images" heuristic used by A1/A2 - a deliberately dark or moody image (e.g. a night scene) should stay dark. In benchmark tests this mode gave the closest match to hand-pixelated reference images.
*   **Reset:** Resets all adjustment sliders to their default values.
*   **Copy Settings (4c / 2c etc. buttons):** Using the small buttons next to the "Image Adjustments" title, you can copy the slider settings from other color modes (e.g., 4-color or 2-color mode) into the current mode with a single click.

### 2.5. Dithering Method
Since the TVC only supports 15 colors, the program simulates gradients using dithering.
*   **Methods:**
    *   **Modernist:** Balance between detail and clean colors.
    *   **Ordered (Classic):** Regular pattern dithering, 80s style.
    *   **Diffusion (Sierra/Stucki/Jarvis):** Natural, error-diffusion based methods.
    *   **Pattern TVC:** Optimized for TVC hardware. It works by creating a checkerboard pattern alternating between two carefully selected colors from the palette. This takes advantage of the TVC's video output characteristics, blending the two colors visually on CRT screens to create the illusion of a third, intermediate color without the noise of error diffusion.
    *   **Threshold (No pattern):** No dithering, nearest color only.
    *   **Yliluoma:** Joel Yliluoma's classic algorithm, designed specifically for small/irregular palettes like the TVC's 15 colors. It generalizes the Pattern TVC idea: instead of mixing exactly 2 colors, it can combine up to 8 palette colors at a given point, using gamma-correct (linear-light) mixing for smoother gradients. *Note:* because the TVC palette has few closely-related shades, this mode can introduce colorful "confetti" noise in flat, dark areas (e.g. a night sky) compared to Pattern TVC - it's most worth trying on photographic, continuous-gradient images.

*   **Pair Blocklist (Pattern TVC / Yliluoma only):** The grid shown under "Dither Tuning" lets you individually disable which two colors are allowed to mix during pattern dithering. Clicking a cell on the grid's diagonal excludes that color *entirely* (from every pair at once); clicking again re-enables it.

*   **Dither Tuning:**
    *   **Dither Amount:** How "grainy" the image is.
    *   **Noise Level:** Adds random patterns to avoid banding.
    *   **Solid Area Snap:** Prevents dithering on solid color areas.

### 2.6. Background Fill
Select one of the 15 fixed TVC colors to fill empty areas.

### 2.7. Export Options
1. **Save as BMP:** Standard Windows BMP file with TVC palette. 
   *   *Note for 16 Colors Mode:* You can save the BMP in either **1:1** pixel ratio (128x240, raw storage format) or **2:1** pixel ratio (256x240, stretched to simulate the actual TVC display).
   *   *TVC256k++ mode:* BMP is saved in 16-color indexed (4 bpp) format (256x240, exactly 30,838 bytes file size).
2. **Save as TVC bin:** Raw binary data for real TVC or emulator.
   *   *TVC256k++ mode:* 256x240 16-color image with 2 points per byte (1st point upper 4 bits, 2nd point lower 4 bits IRGB code, total 30,720 bytes).
3. **Save as ZX7 bin:** Binary data compressed with the ZX7 algorithm (with \`.bin.zx7\` extension), which takes up less space and loads faster on the TVC.

*Filenames automatically include the color/resolution mode suffix (e.g., \`_16c\`, \`_4c\`, \`_2c\`, \`_256k\`). In 16-color mode, the BMP filename will also include the aspect ratio (e.g., \`_1_1\` or \`_2_1\`). Each button has a short description (tooltip) that appears when you hover the mouse over it.*

### 2.8. Advanced Image Processing
New in v3.8 and v3.9, these tools help you prepare your image for the best possible conversion.

*   **Denoising:** Reduces digital noise in the source image. This is especially useful for photos, as it prevents the dithering algorithm from "dotting" the noise, resulting in cleaner, more cohesive surfaces on the TVC.
*   **Unsharp Mask:** A fine sharpening tool that enhances important edges (like the outlines of a face). This helps details "survive" the downscaling process and prevents the final image from looking too blurry.
*   **Tone Mapping:** Compresses the dynamic range of high-contrast images. If your photo has very dark and very bright areas simultaneously, tone mapping helps bring out details in both, making them visible within the TVC's limited palette.
*   **Serpentine Scanning:** Changes the direction of the dithering process for every other line. This breaks up vertical "streaks" and creates more natural-looking dithering patterns.
*   **Perceptual Color Distance:** When enabled, the program calculates color similarity based on how the human eye actually perceives colors (giving more weight to green and less to blue). This results in much more natural-looking color substitutions.
*   **Pixel Art Cleaning:** Automatically removes isolated "stray" pixels that can sometimes appear during dithering. This results in a much cleaner, more "hand-drawn" look, especially for graphics and illustrations.
*   **Auto Color Selection (K-Means):** For 4-color and 2-color modes, this uses a sophisticated mathematical algorithm (K-Means clustering) to find the mathematically optimal set of colors for your specific image, rather than just picking the most frequent ones.
*   **Transparent Background Masking (TVC256k++ / Sprites):** Located on the Composition panel, this automatically maps the solid background surrounding the active drawing. Outer pixels are converted to the **9th black (\`1000\` / \`0x8\` transparent)** code, while inner black parts of the subject are protected. The mask is displayed on screen using a distinct neon-magenta pattern which can be toggled on/off, and exported into BMP and BIN files with the transparent code.

### 2.9. Saving and Loading Settings
On the left panel, you can save your current settings into 3 slots. You can load saved settings at any time using the corresponding number buttons. You can delete saved slots using the small 'x' button in the corner of the button.

## 3. Pixel Editor
A standalone editor for hand-tweaking the converted image pixel by pixel. **Currently supports only the 16-color modes** (standard 16-color 128x240, 2:1 pixel aspect, and the square-pixel TVC256k++ 256x240 mode) - a 4-color and 2-color editor is planned for a future update.

**Opening it:**
*   Next to a finished conversion's results, use the **"Pixel Editor"** button to open the current image for editing.
*   On the start screen (before loading any image), two links let you open a blank (black) canvas directly, in either 16-color or 256k mode.
*   Inside the editor, the **"Open"** button loads a previously-saved PNG that's already at the exact target resolution, directly, **with no conversion** - each pixel's color is mapped one-to-one to the nearest TVC palette color. If the file's dimensions don't match the target exactly, you'll get an error message.
*   The **"Back to converter"** button returns you to the converter - edits made in the editor are not carried back into the converter; they can only be exported from the editor itself.

**View and navigation:**
*   **Zoom:** mouse wheel, centered on the cursor position.
*   **Pan:** hold the middle mouse button and drag, or use the native scrollbars.
*   Above a certain zoom level, the editor shows thin pixel grid lines to make individual pixels easier to tell apart. The grid can be toggled on/off from the top-right toolbar icon.
*   The side panel shows a small live preview of the full image at the correct final aspect ratio.

**Drawing tools:**
*   **Pencil, Line, Rectangle (outline), Filled rectangle, Ellipse, Fill (bucket).**
*   The **thickness** slider controls the pencil and line-based tools' stroke width.
*   The fill (bucket) tool fills the contiguous region of matching color with the new color - select it from the toolbar first.

**Colors:**
*   **Left mouse button** draws with the primary color, **right mouse button** with the secondary color.
*   The palette holds the 15 real TVC colors, plus a 16th **"transparent"** slot (the hardware's 9th black, used by the TVC for masked/transparent pixels). In the editor this slot is shown with an unmistakable magenta-and-black "checkerboard" pattern (not its actual near-black RGB value), so it can never be confused with a real color. On export, it's automatically converted to the correct transparency code (and mask).
*   Left-click a palette swatch to set it as primary, right-click to set it as secondary.

**Saving:** the same formats as the converter are available: **BMP (1:1)**, plus **BMP (2:1)** in 16-color mode, **BIN**, and **BIN (ZX7 compressed)**. Filenames automatically get an \`_edit\` marker and the mode suffix.

## 4. Tips
*   TVC pixels are wide; portrait images often look better rotated.
*   Use "Auto-Tune" if you don't know where to start.
*   Use "Native Size Preview" (eye icon) to see the final TVC look.
*   Experiment with the "Solid Area Snap" setting when using dithering to keep flat backgrounds clean while still smoothing gradients.
*   For high-contrast images, the "Threshold (No pattern)" method often provides the sharpest, most striking results.
*   If your image has a lot of fine text, try the 2-color or 4-color modes, as their higher horizontal resolution makes text much more legible.
*   When preparing images for a real CRT TV, remember that colors will bleed slightly; the "Pattern TVC" dithering method is specifically designed to exploit this blending.
*   **Advanced Tip:** For the best results with photos, try enabling **Perceptual Color Distance** and **Serpentine Scanning** together. If the image looks a bit "muddy", a small amount of **Unsharp Mask** (around 20-30%) can make a huge difference.
